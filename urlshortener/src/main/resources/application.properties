spring.application.name=urlshortener
server.port=${PORT}
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${URLSHORTENER_DB_USER_NEW}
spring.datasource.password=${URLSHORTENER_DB_PASSWORD_NEW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application logs are shown in the console
logging.level.com.DeatHertZ.urlshortener=INFO